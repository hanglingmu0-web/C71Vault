plugins { id 'com.android.application' }
android {
    namespace 'jp.c71.vault'
    compileSdk 36
    defaultConfig { applicationId 'jp.c71.vault'; minSdk 30; targetSdk 35; versionCode 6; versionName '0.5.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; manifestPlaceholders = [vaultAppLabel: 'C71 Vault'] }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.dev'; manifestPlaceholders = [vaultAppLabel: 'C71 Vault 開発版'] }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':usbSerialForAndroid')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
